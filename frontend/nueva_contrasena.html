<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Restablecer contraseña</title>
  <style>
    body {
      background: #0070d8;
      font-family: 'Poppins', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .contenedor-restablecer {
      background: #fff;
      max-width: 500px;
      margin: 60px auto;
      border-radius: 18px;
      padding: 40px 30px 30px 30px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .contenedor-restablecer h2 {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 30px;
    }
    .contenedor-restablecer label {
      font-size: 1.1rem;
      display: block;
      margin-bottom: 10px;
      text-align: left;
    }
    .contenedor-restablecer input[type="password"] {
      width: 80%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
      transition: border 0.2s;
    }
    .contenedor-restablecer input[type="password"]:focus {
      border: 1.5px solid #0070d8;
    }
    .contenedor-restablecer button {
      background: #0070d8;
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .contenedor-restablecer button:hover {
      background: #005bb5;
    }
  </style>
</head>
<body>
  <div class="contenedor-restablecer">
    <h2>Restablecer contraseña</h2>
    <form action="../backend/restablecer_contrasena.php" method="POST">
      <input type="hidden" name="token" id="token">
      <label>Nueva contraseña:</label>
      <input type="password" name="nueva_contrasena" required>
      <button type="submit">Guardar nueva contraseña</button>
    </form>
  </div>
  <script>
    // Obtener token desde la URL
    const params = new URLSearchParams(window.location.search);
    document.getElementById('token').value = params.get('token');
  </script>
</body>
</html>
